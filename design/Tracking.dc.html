<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var list = [{ t: 'تأكد', s: 'done' }, { t: 'بالطريق', s: 'now' }, { t: 'وصل', s: 'next' }, { t: 'خلص', s: 'next' }];
return {
steps: list.map(function (x) {
return {
t: x.t,
bar: 'height: 6px; border-radius: 3px; background: ' + (x.s === 'done' ? '#0B2545' : x.s === 'now' ? '#4CC9F0' : '#E3EAF2') + ';',
label: 'font-size: 12px; text-align: center; ' + (x.s === 'next' ? 'color: #52627A; font-weight: 600;' : 'color: #0B2545; font-weight: 800;')
};
})
};
}
}
</script>
