<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زلال: بلاغ عن مشكلة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6E8F}a:hover{color:#0B2545}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F7FB; font-family: 'Cairo', Tahoma, sans-serif; color: #0B2545; display: flex; flex-direction: column">
<sc-if value="{{form}}" hint-placeholder-val="{{true}}">
<div style="padding: 18px 20px 10px; display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3EAF2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 20px; font-weight: 900">بلّغ عن مشكلة</h1><span style="font-size: 13px; color: #52627A">نرد عليك خلال ساعة بأوقات الدوام</span></div>
</div>
<div style="flex: 1; padding: 4px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">شنو المشكلة؟</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="ord" style="font-size: 14px; font-weight: 800">الطلب المرتبط</label>
<select id="ord" style="height: 48px; border-radius: 12px; border: 1px solid #E3EAF2; background: #FFFFFF; padding: 0 12px; font-family: inherit; font-size: 15px; color: #0B2545"><option>[#1024] · اليوم · خزان سطح</option><option>[#0987] · نيسان · خزان سطح</option><option>بدون طلب</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="desc" style="font-size: 14px; font-weight: 800">اشرحلنا</label>
<textarea id="desc" rows="3" placeholder="مثال: بعد التنظيف بيوم صار الماي بيه ريحة كلور قوية" style="border-radius: 12px; border: 1px solid #E3EAF2; background: #FFFFFF; padding: 10px 12px; font-family: inherit; font-size: 14px; color: #0B2545; resize: none"></textarea>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button onClick="{{addFile}}" style="height: 64px; width: 64px; border-radius: 14px; border: 2px dashed #8FB6CC; background: #FFFFFF; font-family: inherit; font-size: 11px; font-weight: 700; color: #0A6E8F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A6E8F" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>فيديو/صورة</button>
<sc-for list="{{files}}" as="f" hint-placeholder-count="1">
<span style="height: 64px; width: 64px; border-radius: 14px; background: #13315C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="#4CC9F0"><path d="M8 5v14l11-7z"></path></svg></span>
</sc-for>
</div>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E3EAF2; padding: 12px 20px 22px">
<button onClick="{{submit}}" style="width: 100%; height: 56px; border-radius: 16px; border: none; background: #0B2545; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">أرسل البلاغ</button>
</div>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; padding: 0 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
<span style="width: 88px; height: 88px; border-radius: 44px; background: #DCFCE7; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">وصلنا بلاغك</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #52627A">رقم البلاغ <span style="font-weight: 900; color: #0B2545">[ZL-T-2291]</span>. موظف الدعم راح يراسلك بالمحادثة، وإذا يحتاج نرجع الفريق لبيتك مجاناً.</p>
<a href="Chat.dc.html" style="display: flex; align-items: center; justify-content: center; width: 100%; height: 54px; border-radius: 16px; background: #0B2545; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none">افتح المحادثة</a>
<a href="Home.dc.html" style="font-size: 15px; font-weight: 700; min-height: 44px; display: flex; align-items: center">رجوع للرئيسية</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cat: 'smell', files: 1, sent: false };
}
renderVals() {
var self = this;
var base = 'min-height: 50px; padding: 6px 10px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
var cats = [
{ id: 'leak', label: 'تسريب بعد التنظيف' }, { id: 'smell', label: 'ريحة أو لون بالماي' },
{ id: 'late', label: 'تأخر الفريق' }, { id: 'staff', label: 'تعامل الفريق' },
{ id: 'pay', label: 'مشكلة بالدفع' }, { id: 'other', label: 'شي ثاني' }
];
var files = [];
for (var i = 0; i < this.state.files; i++) files.push({ i: i });
return {
form: !this.state.sent,
sent: this.state.sent,
cats: cats.map(function (c) {
var on = self.state.cat === c.id;
return { label: c.label, style: base + (on ? 'background: #E6F7FD; border: 2px solid #0B2545; color: #0B2545;' : 'background: #FFFFFF; border: 2px solid #E3EAF2; color: #34455C;'), pick: function () { self.setState({ cat: c.id }); } };
}),
files: files,
addFile: function () { if (self.state.files < 3) self.setState({ files: self.state.files + 1 }); },
submit: function () { self.setState({ sent: true }); }
};
}
}
</script>
</body>
</html>
