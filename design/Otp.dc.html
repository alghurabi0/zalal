<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زلال: رمز التحقق</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6E8F}a:hover{color:#0B2545}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F7FB; font-family: 'Cairo', Tahoma, sans-serif; color: #0B2545; display: flex; flex-direction: column; padding: 20px 24px 24px; gap: 20px">
<a href="Login.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3EAF2; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 900">رمز التحقق</h1>
<p style="margin: 0; font-size: 16px; color: #52627A; line-height: 1.7">دزينالك رمز من 6 أرقام على واتساب للرقم <span dir="ltr" style="font-weight: 800; color: #0B2545">+964 780 123 4567</span></p>
<a href="Login.dc.html" style="font-size: 14px; font-weight: 700">تغيير الرقم</a>
</div>
<div role="group" aria-label="رمز التحقق" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; direction: ltr">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<div style="{{b.style}}">{{b.d}}</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; color: #52627A">ما وصلك الرمز؟</span>
<span style="font-size: 14px; font-weight: 700; color: #52627A">إعادة الإرسال بعد <span dir="ltr">0:45</span></span>
</div>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Location.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #0B2545; color: #FFFFFF; font-size: 18px; font-weight: 800; text-decoration: none">تحقق وكمّل</a>
</sc-if>
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<button disabled="{{true}}" style="height: 56px; border-radius: 16px; border: none; background: #C9D3E0; color: #52627A; font-family: inherit; font-size: 18px; font-weight: 800">تحقق وكمّل</button>
</sc-if>
<div style="flex: 1"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; direction: ltr">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button onClick="{{k.press}}" aria-label="{{k.aria}}" style="{{k.style}}">{{k.label}}</button>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { code: '48' };
}
renderVals() {
var self = this;
var code = this.state.code;
var boxes = [];
for (var i = 0; i < 6; i++) {
var filled = i < code.length, cur = i === code.length;
boxes.push({ d: filled ? code.charAt(i) : '', style: 'height: 56px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; color: #0B2545; border: 2px solid ' + (cur ? '#0A6E8F' : filled ? '#9FB3C8' : '#E3EAF2') + ';' });
}
var keyBase = 'height: 54px; border-radius: 14px; border: none; font-family: inherit; font-size: 22px; font-weight: 700; color: #0B2545; cursor: pointer; ';
var labels = ['1','2','3','4','5','6','7','8','9','','0','del'];
var keys = labels.map(function (l) {
if (l === '') return { label: '', aria: 'فارغ', style: keyBase + 'background: transparent;', press: function () {} };
if (l === 'del') return { label: '⌫', aria: 'حذف', style: keyBase + 'background: transparent;', press: function () { self.setState({ code: code.slice(0, -1) }); } };
return { label: l, aria: l, style: keyBase + 'background: #FFFFFF;', press: function () { if (code.length < 6) self.setState({ code: code + l }); } };
});
return { boxes: boxes, keys: keys, done: code.length === 6, notDone: code.length < 6 };
}
}
</script>
</body>
</html>
