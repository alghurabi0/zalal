<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زلال: طلباتي</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6E8F}a:hover{color:#0B2545}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F7FB; font-family: 'Cairo', Tahoma, sans-serif; color: #0B2545; display: flex; flex-direction: column">
<div style="padding: 22px 20px 12px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 24px; font-weight: 900">طلباتي</h1>
<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #E3EAF2; border-radius: 14px; padding: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
<button role="tab" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
<sc-for list="{{orders}}" as="o" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 1px solid #E3EAF2; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; color: #52627A">طلب {{o.id}} · {{o.date}}</span>
<span style="{{o.badge}}">{{o.status}}</span>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 14px; background: #E6F7FD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A6E8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12v12H6zM9 5h6v3H9zM6 15q3 -2 6 0t6 0"></path></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">{{o.title}}</span><span style="font-size: 13px; color: #52627A">{{o.where}}</span></span>
<span style="font-size: 15px; font-weight: 900">{{o.price}}</span>
</div>
<div style="display: flex; gap: 8px">
<a href="{{o.href}}" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px; background: #0B2545; color: #FFFFFF; font-size: 14px; font-weight: 800; text-decoration: none">{{o.cta}}</a>
<a href="Chat.dc.html" style="display: flex; align-items: center; justify-content: center; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #E3EAF2; color: #0B2545; font-size: 14px; font-weight: 700; text-decoration: none">مساعدة</a>
</div>
</div>
</sc-for>
</div>
<dc-import name="TabBar" active="orders" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'now' };
}
renderVals() {
var self = this;
var badge = function (bg, fg) { return 'font-size: 12px; font-weight: 800; border-radius: 10px; padding: 2px 10px; background: ' + bg + '; color: ' + fg + ';'; };
var now = [
{ id: '[#1024]', date: 'اليوم 9:00 ص', status: 'الفريق بالطريق', badge: badge('#FEF3C7', '#92400E'), title: 'خزان سطح · 1,000–2,000 لتر', where: 'البيت · [حي الحسين]', price: '[35,000]', cta: 'تتبّع الفريق', href: 'Tracking.dc.html' },
{ id: '[#1031]', date: '[2 تشرين الثاني]', status: 'مؤكد', badge: badge('#E6F7FD', '#0A6E8F'), title: 'خزان أرضي · أكبر من 2,000', where: 'بيت الأهل · [حي العباس]', price: '[120,000]', cta: 'تفاصيل الطلب', href: 'Checkout.dc.html' }
];
var past = [
{ id: '[#0987]', date: '[12 نيسان 2026]', status: 'مكتمل', badge: badge('#DCFCE7', '#15803D'), title: 'خزان سطح · لحد 1,000 لتر', where: 'البيت · [حي الحسين]', price: '[25,000]', cta: 'الشهادة والفيديو', href: 'Report.dc.html' },
{ id: '[#0812]', date: '[3 تشرين الأول 2025]', status: 'مكتمل', badge: badge('#DCFCE7', '#15803D'), title: 'خزان سطح × 2', where: 'البيت · [حي الحسين]', price: '[60,000]', cta: 'أعد الحجز', href: 'Booking.dc.html' }
];
var base = 'height: 40px; border-radius: 10px; border: none; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; ';
return {
tabs: [{ id: 'now', label: 'الحالية' }, { id: 'past', label: 'السابقة' }].map(function (t) {
var on = self.state.tab === t.id;
return { label: t.label, style: base + (on ? 'background: #FFFFFF; color: #0B2545; box-shadow: 0 1px 4px rgba(11,37,69,0.12);' : 'background: transparent; color: #52627A;'), pick: function () { self.setState({ tab: t.id }); } };
}),
orders: this.state.tab === 'now' ? now : past
};
}
}
</script>
</body>
</html>
