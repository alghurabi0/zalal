<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زلال: الحجز، تفاصيل الخزان</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6E8F}a:hover{color:#0B2545}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F7FB; font-family: 'Cairo', Tahoma, sans-serif; color: #0B2545; display: flex; flex-direction: column">
<div style="padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3EAF2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 20px; font-weight: 900">حجز تنظيف</h1><span style="font-size: 13px; color: #52627A">الخطوة 1 من 3 · تفاصيل الخزان</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><span style="height: 5px; border-radius: 3px; background: #0B2545"></span><span style="height: 5px; border-radius: 3px; background: #D3DCE6"></span><span style="height: 5px; border-radius: 3px; background: #D3DCE6"></span></div>
</div>
<div style="flex: 1; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">نوع الخزان</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="2">
<button onClick="{{t.pick}}" style="{{t.style}}">
<svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A6E8F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{t.icon}}"></path></svg>
<span style="font-size: 15px; font-weight: 800; color: #0B2545">{{t.name}}</span>
<span style="font-size: 12px; color: #52627A">{{t.desc}}</span>
</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">السعة</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
<button onClick="{{z.pick}}" style="{{z.style}}">{{z.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; background: #FFFFFF; border: 1px solid #E3EAF2; border-radius: 14px; padding: 8px 12px">
<span style="font-size: 15px; font-weight: 800">عدد الخزانات</span>
<div style="display: flex; align-items: center; gap: 12px">
<button onClick="{{dec}}" aria-label="أقل" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #E3EAF2; background: #F4F7FB; font-family: inherit; font-size: 22px; font-weight: 800; color: #0B2545; cursor: pointer">−</button>
<span style="font-size: 20px; font-weight: 900; min-width: 20px; text-align: center">{{count}}</span>
<button onClick="{{inc}}" aria-label="أكثر" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #0B2545; font-family: inherit; font-size: 22px; font-weight: 800; color: #FFFFFF; cursor: pointer">+</button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">الموعد</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" style="{{d.style}}"><span style="font-size: 12px">{{d.wd}}</span><span style="font-size: 18px; font-weight: 900">{{d.n}}</span></button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="3">
<button onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>
</div>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E3EAF2; padding: 12px 20px 22px; display: flex; align-items: center; gap: 14px">
<div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #52627A">السعر التقريبي</span><span style="font-size: 20px; font-weight: 900">{{price}}</span></div>
<a href="Upload.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #0B2545; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none">التالي</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { type: 'roof', size: 'm', count: 1, day: 0, slot: 0 };
}
renderVals() {
var self = this, st = this.state;
var on = 'background: #E6F7FD; border: 2px solid #0B2545; color: #0B2545;';
var off = 'background: #FFFFFF; border: 2px solid #E3EAF2; color: #52627A;';
var chip = 'min-height: 46px; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; ';
var card = 'padding: 12px; border-radius: 16px; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: right; ';
var table = { roof: { s: 25000, m: 35000, l: 50000 }, ground: { s: 60000, m: 80000, l: 120000 } };
var total = table[st.type][st.size] * st.count;
return {
types: [
{ id: 'roof', name: 'خزان سطح', desc: 'بلاستيك أو فايبر', icon: 'M6 8h12v12H6zM9 5h6v3H9zM6 15q3 -2 6 0t6 0' },
{ id: 'ground', name: 'خزان أرضي', desc: 'كونكريت أو حديد', icon: 'M3 10h18M5 10v10h14V10M9 14q1.5 -1 3 0t3 0M10 6h4v4h-4z' }
].map(function (t) { return Object.assign({}, t, { style: card + (st.type === t.id ? on : off), pick: function () { self.setState({ type: t.id }); } }); }),
sizes: [{ id: 's', label: 'لحد 1,000 لتر' }, { id: 'm', label: '1,000–2,000' }, { id: 'l', label: 'أكبر' }].map(function (z) { return { label: z.label, style: chip + (st.size === z.id ? on : off), pick: function () { self.setState({ size: z.id }); } }; }),
count: st.count,
inc: function () { if (st.count < 6) self.setState({ count: st.count + 1 }); },
dec: function () { if (st.count > 1) self.setState({ count: st.count - 1 }); },
days: [{ wd: 'السبت', n: '24' }, { wd: 'الأحد', n: '25' }, { wd: 'الاثنين', n: '26' }, { wd: 'الثلاثاء', n: '27' }].map(function (d, i) { return Object.assign({}, d, { style: chip + 'min-height: 60px; ' + (st.day === i ? on : off), pick: function () { self.setState({ day: i }); } }); }),
slots: ['8–10 الصبح', '10–12 الظهر', '4–6 العصر'].map(function (s, i) { return { label: s, style: chip + (st.slot === i ? on : off), pick: function () { self.setState({ slot: i }); } }; }),
price: '[' + total.toLocaleString('en-US') + ' د.ع]'
};
}
}
</script>
</body>
</html>
