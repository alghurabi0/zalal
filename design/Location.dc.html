<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tag: 'home' };
}
renderVals() {
var self = this;
var base = 'height: 40px; padding: 0 16px; border-radius: 20px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ';
return {
tags: [{ id: 'home', label: 'البيت' }, { id: 'family', label: 'بيت الأهل' }, { id: 'work', label: 'الشغل' }].map(function (t) {
var on = self.state.tag === t.id;
return { label: t.label, style: base + (on ? 'background: #0B2545; color: #FFFFFF; border: 2px solid #0B2545;' : 'background: #FFFFFF; color: #52627A; border: 2px solid #E3EAF2;'), pick: function () { self.setState({ tag: t.id }); } };
})
};
}
}
</script>
