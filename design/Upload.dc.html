<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>زلال: الحجز، صور وفيديو الخزان</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400..900&amp;display=swap">
<style>
body{margin:0}
a{color:#0A6E8F}a:hover{color:#0B2545}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #F4F7FB; font-family: 'Cairo', Tahoma, sans-serif; color: #0B2545; display: flex; flex-direction: column">
<div style="padding: 18px 20px 8px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Booking.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E3EAF2; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></a>
<div style="flex: 1; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 20px; font-weight: 900">صوّر خزانك</h1><span style="font-size: 13px; color: #52627A">الخطوة 2 من 3 · اختياري بس يفيدنا</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px"><span style="height: 5px; border-radius: 3px; background: #0B2545"></span><span style="height: 5px; border-radius: 3px; background: #0B2545"></span><span style="height: 5px; border-radius: 3px; background: #D3DCE6"></span></div>
</div>
<div style="flex: 1; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #34455C">فيديو قصير لداخل الخزان والسطح يساعد الفريق يجيب المعدات الصحيحة ويعطيك سعر أدق.</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{addVideo}}" style="height: 110px; border-radius: 18px; border: 2px dashed #8FB6CC; background: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #0B2545">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #0B2545; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h12v10H3zM15 10l6-3v10l-6-3"></path></svg></span>
<span style="font-size: 14px; font-weight: 800">صوّر فيديو</span></button>
<button onClick="{{addPhoto}}" style="height: 110px; border-radius: 18px; border: 2px dashed #8FB6CC; background: #FFFFFF; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #0B2545">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #E6F7FD; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A6E8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-8 8"></path></svg></span>
<span style="font-size: 14px; font-weight: 800">من المعرض</span></button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{files}}" as="f" hint-placeholder-count="2">
<div style="background: #FFFFFF; border: 1px solid #E3EAF2; border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 10px">
<span style="width: 52px; height: 52px; border-radius: 10px; background: #13315C; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="#4CC9F0"><path d="{{f.icon}}"></path></svg></span>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between"><span style="font-size: 14px; font-weight: 800">{{f.name}}</span><span style="font-size: 12px; font-weight: 700; color: {{f.statusColor}}">{{f.status}}</span></div>
<div style="height: 6px; border-radius: 3px; background: #E3EAF2; overflow: hidden; display: flex"><div style="{{f.bar}}"></div></div>
<span style="font-size: 12px; color: #52627A">{{f.meta}}</span>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="note" style="font-size: 14px; font-weight: 800">ملاحظة للفريق</label>
<textarea id="note" rows="2" placeholder="مثال: الخزان على سطح الطابق الثاني والدرج ضيق" style="border-radius: 14px; border: 1px solid #E3EAF2; background: #FFFFFF; padding: 10px 12px; font-family: inherit; font-size: 14px; color: #0B2545; resize: none"></textarea>
</div>
</div>
<div style="background: #FFFFFF; border-top: 1px solid #E3EAF2; padding: 12px 20px 22px; display: flex; gap: 10px">
<a href="Checkout.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 16px; background: #0B2545; color: #FFFFFF; font-size: 17px; font-weight: 800; text-decoration: none">التالي</a>
<a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; padding: 0 18px; border-radius: 16px; color: #0A6E8F; font-size: 15px; font-weight: 800; text-decoration: none">تخطي</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { files: [
{ kind: 'video', name: 'داخل الخزان', meta: 'فيديو · 0:24 · 18 MB', p: 100 },
{ kind: 'video', name: 'السطح والدرج', meta: 'فيديو · 0:11 · 8 MB', p: 64 }
] };
}
renderVals() {
var self = this;
var play = 'M8 5v14l11-7z', img = 'M4 5h16v14H4zM8 10a1.5 1.5 0 1 0 0-.1M20 16l-5-5-9 8';
function add(kind) {
var n = self.state.files.length + 1;
self.setState({ files: self.state.files.concat([{ kind: kind, name: kind === 'video' ? 'فيديو ' + n : 'صورة ' + n, meta: kind === 'video' ? 'فيديو · 0:09 · 6 MB' : 'صورة · 2 MB', p: 30 }]) });
}
return {
addVideo: function () { add('video'); },
addPhoto: function () { add('photo'); },
files: this.state.files.map(function (f) {
var done = f.p >= 100;
return {
name: f.name, meta: f.meta, icon: f.kind === 'video' ? play : img,
status: done ? 'تم الرفع' : 'جاري الرفع ' + f.p + '%',
statusColor: done ? '#15803D' : '#0A6E8F',
bar: 'width: ' + f.p + '%; border-radius: 3px; background: ' + (done ? '#16A34A' : '#0A6E8F') + ';'
};
})
};
}
}
</script>
</body>
</html>
