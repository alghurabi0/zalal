# Install scripts these packages don't need here: sharp and unrs-resolver ship
# prebuilt binaries; esbuild's script only re-checks the platform binary that
# pnpm already installs as an optional dependency; @parcel/watcher and
# @swc/core are only used by next-intl's optional message extractor, which
# this app doesn't use.
ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - esbuild
  - sharp
  - unrs-resolver
