name: Set up pnpm and Node
description: Installs pnpm (version from package.json), Node 22 and the locked dependencies.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
